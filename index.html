<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כלי לקביעת פגישות</title>

<style>
body{
  font-family:system-ui,sans-serif;
  margin:0;
  background:#f5f5f5;
  padding:16px;
}

.wrap{
  max-width:700px;
  margin:auto;
}

textarea{
  width:100%;
  padding:14px;
  font-size:18px;
  border-radius:10px;
  border:1px solid #ccc;
  min-height:120px;
}

button{
  padding:12px 20px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">
<h2>כלי לקביעת פגישות</h2>

<textarea id="eventText"
placeholder="לדוגמה:
פגישה עם יוסי 2/2 14:30"></textarea>

<button onclick="addToCalendar()">הוסף ליומן</button>
</div>

<script>
function addToCalendar(){

const text=document.getElementById("eventText").value;

if(!text){
alert("לא כתבת אירוע");
return;
}

const dateMatch=text.match(/(\d{1,2})[\/.](\d{1,2})/);
if(!dateMatch){
alert("לא נמצא תאריך");
return;
}

const timeMatch=text.match(/(\d{1,2}):(\d{2})/);

let year=new Date().getFullYear();
let month=dateMatch[2];
let day=dateMatch[1];

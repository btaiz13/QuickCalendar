<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כלי לקביעת פגישות</title>

<style>
body{
  font-family:system-ui,sans-serif;
  margin:0;
  background:#f5f5f5;
  padding:16px;
}

.wrap{
  max-width:700px;
  margin:auto;
}

textarea{
  width:100%;
  padding:14px;
  font-size:18px;
  border-radius:10px;
  border:1px solid #ccc;
  min-height:120px;
}

button{
  padding:12px 20px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">
<h2>כלי לקביעת פגישות</h2>

<textarea id="eventText"
placeholder="לדוגמה:
פגישה עם יוסי 2/2 14:30"></textarea>

<button onclick="addToCalendar()">הוסף ליומן</button>
</div>

<script>
window.addToCalendar = function () {
  const text = document.getElementById("eventText").value.trim();

  if (!text) {
    alert("לא כתבת אירוע");
    return;
  }

  const dateMatch = text.match(/(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?/);
  if (!dateMatch) {
    alert("לא נמצא תאריך. דוגמה: 05.02 או 2/2 14:30");
    return;
  }

  const day = parseInt(dateMatch[1], 10);
  const month = parseInt(dateMatch[2], 10);

  let year = new Date().getFullYear();
  if (dateMatch[3]) {
    let y = parseInt(dateMatch[3], 10);
    if (y < 100) y = 2000 + y;
    year = y;
  }

  const range = text.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  const single = text.match(/(\d{1,2}):(\d{2})/);

  let start, end;

  if (range) {
    const sh = parseInt(range[1], 10), sm = parseInt(range[2], 10);
    const eh = parseInt(range[3], 10), em = parseInt(range[4], 10);

    start = new Date(year, month - 1, day, sh, sm, 0);
    end   = new Date(year, month - 1, day, eh, em, 0);
    if (end <= start) end.setDate(end.getDate() + 1); // אם טווח חוצה חצות
  } else if (single) {
    const sh = parseInt(single[1], 10), sm = parseInt(single[2], 10);
    start = new Date(year, month - 1, day, sh, sm, 0);
    end = new Date(start.getTime());
    end.setMinutes(end.getMinutes() + 60); // ברירת מחדל שעה
  } else {
    // כל היום
    start = new Date(year, month - 1, day, 0, 0, 0);
    end = new Date(start.getTime());
    end.setDate(end.getDate() + 1);
  }

  function pad2(n) { return String(n).padStart(2, "0"); }
  function fmt(d) {
    return d.getFullYear()
      + pad2(d.getMonth() + 1)
      + pad2(d.getDate())
      + "T"
      + pad2(d.getHours())
      + pad2(d.getMinutes())
      + "00";
  }

  const url = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(text)
    + "&dates=" + encodeURIComponent(fmt(start) + "/" + fmt(end));

  // פתיחה אמינה בטאב חדש
  const a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  document.body.appendChild(a);
  a.click();
  a.remove();
};
</script>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כלי לקביעת פגישות והתראות</title>

<style>
body{
  font-family:system-ui,sans-serif;
  margin:0;
  background:#f5f5f5;
  padding:16px;
}

.wrap{
  max-width:900px;
  margin:auto;
}

h1{
  font-size:28px;
  margin-bottom:14px;
}

textarea{
  width:100%;
  font-size:20px;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  resize:none;
  min-height:120px;
  box-sizing:border-box;
  background:white;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:#111;
  color:#fff;
}

.secondary{
  background:#e9e9e9;
  color:#111;
}

.hint{
  margin-top:10px;
  color:#555;
  font-size:14px;
}

/* מובייל */
@media(max-width:600px){

.wrap{
  padding-bottom:90px;
}

.actions{
  position:fixed;
  bottom:12px;
  left:12px;
  right:12px;
  background:#f5f5f5;
  padding:10px;
  border-radius:14px;
  border:1px solid #ddd;
}

textarea{
  min-height:180px;
  font-size:22px;
}

.actions button{
  flex:1;
}
}
</style>
</head>

<body>

<div class="wrap">

<div class="actions">
<button id="addBtn">הוסף ליומן</button>
<button id="clearBtn" class="secondary">נקה</button>
</div>

<div class="hint">
תאריך: DD/MM או DD.MM  
שעה: HH:MM או HH:MM-HH:MM  
Enter = הוספה ליומן
</div>

</div>
